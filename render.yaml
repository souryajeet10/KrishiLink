# Render Blueprint Specification for KrishiLink
# Deploy backend API, PostgreSQL database, and Redis cache on Render.com

version: "1"

services:
  # ── KrishiLink Express Backend Service ──────────────────────────────
  - type: web
    name: krishilink-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: krishilink-postgres
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: krishilink-redis
          property: connectionString
      - key: REDIS_CACHE_TTL
        value: "10800"
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: AGMARKNET_RESOURCE_ID
        value: "9ef84268-d588-465a-a308-a864a43d0070"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_DEV_MODE
        value: "false"
      - key: CORS_ORIGIN
        value: "*"

  # ── Redis Cache Service ─────────────────────────────────────────────
  - type: redis
    name: krishilink-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Only internal Render services

databases:
  # ── Managed PostgreSQL with PostGIS Support ─────────────────────────
  - name: krishilink-postgres
    databaseName: krishilink
    user: krishilink_user
    region: oregon
    plan: starter
    postgresMajorVersion: "16"
